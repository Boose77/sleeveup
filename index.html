<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SleeveUp!</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700;900&display=swap');

    :root {
        --bg: #080d1f;
        --header: #090918;
        --panel: #02050b;
        --field: #181a1a;
        --text: #f4f4f4;
        --muted: #b8b8b8;
        --accent: #ffcc24;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        min-height: 100%;
        position: relative;
        background:
            radial-gradient(circle at 50% 58%, rgba(28, 36, 74, .28), transparent 48%),
            linear-gradient(135deg, #071329 0%, #080d1f 45%, #070b1b 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
    }

    body::before {
        content: "";
        position: fixed;
        inset: -12px;
        z-index: 0;
        background: var(--page-background-image, url("sleeveup_background.jpg")) center / cover no-repeat;
        filter: blur(80px);
        opacity: .15;
        transform: scale(1.15);
        pointer-events: none;
    }

    header {
        position: relative;
        z-index: 1;
        height: 85px;
        border-bottom: 1px solid rgba(59, 59, 59, .4);
        background: rgba(6, 8, 19, .9);
        display: flex;
        align-items: center;
    }

    .header-inner {
        width: 810px;
        max-width: calc(100% - 48px);
        margin: 0 auto;
    }

    .logo {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-family: Roboto, sans-serif;
        font-weight: 900;
        font-size: 19px;
        letter-spacing: -1px;
    }

    .logo-mark {
        width: 23px;
        height: 26px;
        background: white;
        display: inline-block;
        transform: skewY(-1deg);
    }

    .logo span {
        color: #f5f5f5;
    }

    .logo em {
        color: #da1e7a;
        font-style: normal;
    }

    main {
        position: relative;
        z-index: 1;
        min-height: calc(100vh - 108px);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 98px 24px 70px;
    }

    .workspace {
        width: 900px;
        max-width: 100%;
        min-height: 555px;
        padding: 38px 40px 35px;
        border-radius: 17px;
        background: rgba(0, 3, 8, .86);
        box-shadow: 0 18px 60px rgba(0,0,0,.35);
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 52px;
    }

    .card-column {
        min-width: 0;
        position: relative;
    }

    .card-wrap {
        position: relative;
        width: 320px;
        max-width: 100%;
        margin: 0 auto;
        padding: 8px;
        border: 2px solid var(--inner-color, var(--sleeve-color, var(--accent)));
        border-radius: 2px;
        background-color: var(--inner-color, var(--sleeve-color, var(--accent)));
        background-image:
            repeating-linear-gradient(135deg, rgba(255,255,255,.13) 0 1px, transparent 1px 4px),
            repeating-linear-gradient(45deg, rgba(0,0,0,.10) 0 1px, transparent 1px 5px);
        background-size: 5px 5px, 7px 7px;
        box-shadow: 0 5px 18px rgba(0,0,0,.35);
    }

    .card {
        width: 100%;
        aspect-ratio: 0.717;
        max-width: 100%;
        border-radius: 1px;
        overflow: hidden;
        background: #111;
        position: relative;
    }

    .card-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .sleeve-overlay {
        position: absolute;
        inset: -2px;
        z-index: 1;
        background-color: var(--sleeve-color, var(--accent));
        background-image:
            repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 2px, transparent 2px 5px),
            repeating-linear-gradient(45deg, rgba(0,0,0,.10) 0 1px, transparent 1px 5px);
        background-size: 5px 5px, 7px 7px;
        clip-path: polygon(80% 0, 100% 0, 100% 100%, 20% 100%);
    }

    .caption {
        margin-top: 9px;
        text-align: center;
        font-family: Oswald, Impact, sans-serif;
        font-size: 18px;
        font-weight: 600;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .controls {
        min-width: 0;
    }

    input[type="search"] {
        width: 100%;
        height: 42px;
        padding: 0 13px;
        border: 0;
        outline: none;
        background: var(--field);
        color: white;
        font-family: Oswald, Impact, sans-serif;
        font-size: 17px;
        text-transform: uppercase;
    }

    input[type="search"]::placeholder {
        color: #eeeeee;
        opacity: 1;
    }

    .search-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 74px 96px;
        gap: 7px;
    }

    .search-labels {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 74px 96px;
        gap: 7px;
        margin-bottom: 4px;
        color: var(--muted);
        font-family: Oswald, Impact, sans-serif;
        font-size: 13px;
        line-height: 1;
        text-transform: uppercase;
    }

    .set-search {
        width: 100%;
        height: 42px;
        padding: 0 10px;
        border: 0;
        outline: none;
        background: var(--field);
        color: white;
        font-family: Oswald, Impact, sans-serif;
        font-size: 17px;
        text-transform: uppercase;
    }

    .set-search::placeholder {
        color: #eeeeee;
        opacity: 1;
    }

    .search-button {
        height: 42px;
        border: 0;
        background: var(--accent);
        color: #111;
        font-family: Oswald, Impact, sans-serif;
        font-size: 17px;
        font-weight: 600;
        text-transform: uppercase;
        cursor: pointer;
    }

    .search-button:hover {
        background: #ffe16a;
    }

    .sleeve-select {
        width: 100%;
        height: 43px;
        margin-top: 7px;
        padding: 0 15px;
        border: 0;
        border-radius: 0;
        outline: none;
        background: var(--field);
        color: white;
        font-family: Oswald, Impact, sans-serif;
        font-size: 17px;
        text-transform: uppercase;
        cursor: pointer;
    }

    .ad {
        margin-top: 7px;
        min-height: 347px;
        background: var(--field);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
        font-family: Oswald, Impact, sans-serif;
        font-size: 30px;
        line-height: 1.25;
        text-transform: uppercase;
    }

    @media (max-width: 800px) {
        main {
            padding-top: 45px;
        }

        .workspace {
            grid-template-columns: 1fr;
            gap: 38px;
            width: 520px;
            padding: 30px;
        }

        .card-wrap {
            width: 300px;
        }

        .card {
            width: 300px;
        }

        .controls {
            width: 100%;
        }
    }

    @media (max-width: 430px) {
        header { height: 78px; }

        .header-inner {
            max-width: calc(100% - 30px);
        }

        main {
            min-height: calc(100vh - 78px);
            padding: 25px 12px;
        }

        .workspace {
            padding: 22px 16px 25px;
            border-radius: 12px;
        }

        .caption {
            font-size: 15px;
        }

        .ad {
            min-height: 260px;
            font-size: 23px;
        }
    }
</style>
</head>

<body>
<header>
    <div class="header-inner">
        <div class="logo" aria-label="SleeveUp">
            <span class="logo-mark"></span>
            <span>SLEEVE<em>UP</em></span>
        </div>
    </div>
</header>

<main>
    <section class="workspace">
        <div class="card-column">
            <div class="card-wrap">
                <div class="card" id="card" hidden>
                    <img class="card-image" id="card-image" alt="">
                </div>
                <div class="sleeve-overlay" aria-label="Outer sleeve overlay"></div>
            </div>

            <div class="caption" id="caption">Select a card and sleeve</div>
        </div>

        <div class="controls">
            <div class="search-labels" aria-hidden="true">
                <span>Card Name</span>
                <span>Set</span>
            </div>
            <div class="search-row">
                <input id="search" type="search" placeholder="Search for new card..." autocomplete="off">
                <input id="set-search" class="set-search" type="text" placeholder="SET" maxlength="3" pattern="[A-Za-z]{3}" aria-label="Three-letter card set code" autocomplete="off">
                <button id="search-button" class="search-button" type="button">Search</button>
            </div>

            <select class="sleeve-select" id="sleeve-select" aria-label="Choose a sleeve brand and color">
                <optgroup label="Dragon Shield Matte">
                    <option value="black" data-color="#0b0d0d">Black</option>
                    <option value="black-non-glare" data-color="#111313">Black (Non-Glare)</option>
                    <option value="jet" data-color="#1a1b1c">Jet</option>
                    <option value="silver" data-color="#bfc2c2">Silver</option>
                    <option value="justice" data-color="#c5c9c8">Justice*</option>
                    <option value="snow" data-color="#f5f5ef">Snow*</option>
                    <option value="white" data-color="#fffef8">White</option>
                    <option value="valor" data-color="#fff4c9">Valor*</option>
                    <option value="ivory" data-color="#fff4cf">Ivory</option>
                    <option value="lightning" data-color="#fff200">Lightning*</option>
                    <option value="yellow" data-color="#ffd72b" selected>Yellow</option>
                    <option value="amber" data-color="#ffb12b">Amber</option>
                    <option value="orange" data-color="#ff8f12">Orange</option>
                    <option value="ember" data-color="#f24b17">Ember*</option>
                    <option value="copper" data-color="#a95c22">Copper</option>
                    <option value="red" data-color="#b9251f">Red</option>
                    <option value="blood-red" data-color="#8d2331">Blood Red</option>
                    <option value="ruby" data-color="#d32935">Ruby</option>
                    <option value="crimson" data-color="#d92734">Crimson</option>
                    <option value="fury" data-color="#e90046">Fury*</option>
                    <option value="peach" data-color="#f58485">Peach*</option>
                    <option value="pink" data-color="#f4a4b8">Pink</option>
                    <option value="pink-diamond" data-color="#ef4b90">Pink Diamond</option>
                    <option value="magenta" data-color="#bd0070">Magenta</option>
                    <option value="wraith" data-color="#9b3f86">Wraith*</option>
                    <option value="pomegranate-gold" data-color="#9c3a57">Pomegranate &amp; Gold*</option>
                    <option value="orchid" data-color="#d6c7e4">Orchid*</option>
                    <option value="amethyst" data-color="#70518d">Amethyst</option>
                    <option value="purple" data-color="#5d35a2">Purple</option>
                    <option value="soul" data-color="#55486f">Soul*</option>
                    <option value="night-blue" data-color="#3c3d78">Night Blue</option>
                    <option value="midnight-blue" data-color="#12375c">Midnight Blue</option>
                    <option value="blue" data-color="#1e59a1">Blue</option>
                    <option value="wisdom" data-color="#1d71b4">Wisdom*</option>
                    <option value="cobalt-silver" data-color="#1c79a3">Cobalt &amp; Silver*</option>
                    <option value="sapphire" data-color="#009ce4">Sapphire</option>
                    <option value="lagoon" data-color="#6b9cc3">Lagoon*</option>
                    <option value="eucalyptus" data-color="#c0e4d3">Eucalyptus*</option>
                    <option value="mint" data-color="#53c6b3">Mint</option>
                    <option value="glacier" data-color="#1caab9">Glacier*</option>
                    <option value="turquoise" data-color="#1aa9c6">Turquoise</option>
                    <option value="aurora" data-color="#21ba97">Aurora</option>
                    <option value="petrol" data-color="#147d7b">Petrol</option>
                    <option value="power" data-color="#135c58">Power*</option>
                    <option value="forest-green" data-color="#51713d">Forest Green</option>
                    <option value="might" data-color="#1d7f48">Might*</option>
                    <option value="green" data-color="#098c43">Green</option>
                    <option value="emerald" data-color="#159b55">Emerald</option>
                    <option value="apple-green" data-color="#09b83e">Apple Green</option>
                    <option value="gold" data-color="#b08a0a">Gold</option>
                    <option value="truth" data-color="#a99f89">Truth*</option>
                    <option value="crypt" data-color="#9c9c98">Crypt*</option>
                    <option value="clear" data-color="#f1f1ec">Clear</option>
                </optgroup>
                <optgroup label="Dragon Shield Dual Matte" id="dual-matte-options"></optgroup>
            </select>

            <div class="ad">
                <div>
                    SOME BULLSHIT HERE<br>
                    WITH LINKS<br>
                    TO BUY<br>
                    THE SLEEVES
                </div>
            </div>
        </div>
    </section>
</main>

<script>
    const search = document.getElementById('search');
    const setSearch = document.getElementById('set-search');
    const searchButton = document.getElementById('search-button');
    const card = document.getElementById('card');
    const cardImage = document.getElementById('card-image');
    const cardWrap = document.querySelector('.card-wrap');
    const caption = document.getElementById('caption');
    const sleeveSelect = document.getElementById('sleeve-select');
    const dualMatteOptions = document.getElementById('dual-matte-options');
    const dualInnerColors = {
        'pomegranate-gold': '#b08a0a',
        'cobalt-silver': '#c0c7c6'
    };

    document.querySelectorAll('optgroup[label="Dragon Shield Matte"] option').forEach(option => {
        if (!option.textContent.includes('*')) return;
        const dualOption = option.cloneNode(true);
        dualOption.value = `dual-${option.value}`;
        dualOption.selected = false;
        dualOption.removeAttribute('selected');
        dualOption.textContent = option.textContent.replace(/\*/g, '').trim();
        dualOption.dataset.innerColor = dualInnerColors[option.value] || '#0b0d0d';
        dualMatteOptions.appendChild(dualOption);
        option.remove();
    });

    searchButton.addEventListener('click', searchForCard);

    search.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
            event.preventDefault();
            searchForCard();
        }
    });

    setSearch.addEventListener('input', () => {
        setSearch.value = setSearch.value.replace(/[^a-z]/gi, '').slice(0, 3).toUpperCase();
    });

    sleeveSelect.addEventListener('change', event => {
        const option = event.target.selectedOptions[0];
        cardWrap.style.setProperty('--sleeve-color', option.dataset.color);
        cardWrap.style.setProperty('--inner-color', option.dataset.innerColor || option.dataset.color);
        caption.textContent = `${option.textContent} - ${cardImage.alt || 'Select a card'}`;
    });

    function searchForCard() {
        const cardName = search.value.trim();
        const setCode = setSearch.value.trim().toLowerCase();
        if (cardName) loadCard(cardName, setCode);
    }

    async function loadCard(cardName, setCode = '') {
        caption.textContent = 'Searching Scryfall...';
        try {
            const setParameter = setCode ? `&set=${encodeURIComponent(setCode)}` : '';
            const response = await fetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(cardName)}${setParameter}`);
            if (!response.ok) throw new Error('Card not found');
            const data = await response.json();
            if (!data.image_uris?.normal) throw new Error('No card image available');
            cardImage.src = data.image_uris.normal;
            cardImage.alt = data.name;
            document.body.style.setProperty(
                '--page-background-image',
                `url("${data.image_uris.art_crop || data.image_uris.normal}")`
            );
            setSearch.value = data.set.toUpperCase();
            card.hidden = false;
            caption.textContent = `${sleeveSelect.selectedOptions[0].textContent} - ${data.name}`;
        } catch (error) {
            caption.textContent = 'Card not found - try another search';
        }
    }

    sleeveSelect.dispatchEvent(new Event('change'));
    search.value = 'Black Lotus';
    loadCard('Black Lotus').then(() => setSearch.value = setSearch.value.toUpperCase());
</script>
</body>
</html>
